name: Meepo
options:
  bundleIdPrefix: com.azamatfg
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.19.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # TAXITECH team (decision 2026-09-24): the widget's App Group needs a Team ID.
    DEVELOPMENT_TEAM: 7N5485K2AV
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_STYLE: Manual

targets:
  Meepo:
    type: application
    platform: macOS
    sources: [Meepo]
    dependencies:
      - package: GRDB
      - package: SwiftTerm
      - target: MeepoWidget
    entitlements:
      path: Meepo/Meepo.entitlements
      properties:
        com.apple.security.application-groups: [7N5485K2AV.com.azamatfg.meepo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azamatfg.meepo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Meepo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # No App Sandbox: Meepo spawns claude/git/gh and reads ~/.claude.

  MeepoWidget:
    type: app-extension
    platform: macOS
    sources:
      - MeepoWidget
      - Meepo/Widget/WidgetSnapshot.swift
      - Meepo/Design/Tokens.swift
      - Meepo/Design/TokenFormat.swift
      - path: Meepo/Resources/Fonts
        buildPhase: resources
    info:
      path: MeepoWidget/Info.plist
      properties:
        CFBundleDisplayName: Meepo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MeepoWidget/MeepoWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [7N5485K2AV.com.azamatfg.meepo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azamatfg.meepo.widget
        ENABLE_HARDENED_RUNTIME: YES

  MeepoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MeepoTests]
    dependencies:
      - target: Meepo
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Meepo:
    build:
      targets:
        Meepo: all
        MeepoTests: [test]
    test:
      targets: [MeepoTests]
