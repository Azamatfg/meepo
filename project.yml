name: Meepo
options:
  bundleIdPrefix: com.azamatfg
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.19.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # SERMIR team (2026-09-24: its Developer ID signs Meepo); the widget's App Group needs a Team ID.
    DEVELOPMENT_TEAM: ZKXQWVLBRG
    CODE_SIGN_IDENTITY: Developer ID Application
    CODE_SIGN_STYLE: Manual
    # The release workflow sets the tag (v0.1.4-beta); local builds leave it empty and never self-update.
    MEEPO_RELEASE_TAG: ""
  configs:
    # Warn about expressions slow to type-check: CI's release build gave up on one that Debug here accepted
    # (0.2.6, 2026-09-25). Fix any such warning before tagging.
    Debug:
      OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-expression-type-checking=500"
    # Notarization rejects get-task-allow (the debugger entitlement Xcode injects); Debug keeps it for tests.
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  Meepo:
    type: application
    platform: macOS
    sources:
      - path: Meepo
        excludes: ["Resources/Monaco/**", "Resources/meepo"]
      # A folder reference keeps Monaco's vs/ tree intact in the bundle (its loader resolves by path).
      - path: Meepo/Resources/Monaco
        type: folder
        buildPhase: resources
      # The `meepo` command; the cask links it into PATH (keeps its executable bit in the bundle).
      - path: Meepo/Resources/meepo
        buildPhase: resources
    dependencies:
      - package: GRDB
      - package: SwiftTerm
      - target: MeepoWidget
    entitlements:
      path: Meepo/Meepo.entitlements
      properties:
        com.apple.security.application-groups: [ZKXQWVLBRG.com.azamatfg.meepo]
    # meepo:// — the `meepo` command (Resources/meepo) hands folders to the running app through it.
    info:
      path: Meepo/Info.plist
      properties:
        MeepoReleaseTag: $(MEEPO_RELEASE_TAG)
        CFBundleURLTypes:
          - CFBundleURLName: com.azamatfg.meepo
            CFBundleURLSchemes: [meepo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azamatfg.meepo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Meepo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # No App Sandbox: Meepo spawns claude/git/gh and reads ~/.claude.

  MeepoWidget:
    type: app-extension
    platform: macOS
    sources:
      - MeepoWidget
      - Meepo/Widget/WidgetSnapshot.swift
      - Meepo/Design/Tokens.swift
      - Meepo/Design/TokenFormat.swift
      - path: Meepo/Resources/Fonts
        buildPhase: resources
    info:
      path: MeepoWidget/Info.plist
      properties:
        CFBundleDisplayName: Meepo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MeepoWidget/MeepoWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [ZKXQWVLBRG.com.azamatfg.meepo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azamatfg.meepo.widget
        ENABLE_HARDENED_RUNTIME: YES

  MeepoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MeepoTests]
    dependencies:
      - target: Meepo
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Meepo:
    build:
      targets:
        Meepo: all
        MeepoTests: [test]
    test:
      targets: [MeepoTests]
