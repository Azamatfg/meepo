# Tag vX.Y.Z → universal Meepo.app, signed with Developer ID, notarized, attached to a GitHub Release.
# Secrets: DEVELOPER_ID_P12 (base64 of the .p12), DEVELOPER_ID_P12_PASSWORD,
#          NOTARY_APPLE_ID, NOTARY_PASSWORD (app-specific password). Team: SERMIR, TOO (ZKXQWVLBRG).
name: Release

on:
  push:
    tags: ["v*"]
  # A dry run: build, sign, notarize and keep Meepo.zip as a workflow artifact — no GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TEAM_ID: ZKXQWVLBRG
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
        run: |
          if [ -z "$P12" ] || [ -z "$APPLE_ID" ]; then
            echo "::error::Developer ID certificate or notary credentials missing — see the comment at the top of release.yml"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          VERSION="${VERSION#v}"
          VERSION="${VERSION%%-*}"   # v0.1.0-beta → 0.1.0 inside the app; the tag keeps "-beta"
          # The newest Xcode on the runner; older ones ship the Metal toolchain, newer ones download it.
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          if xcodebuild -help 2>&1 | grep -q -- -downloadComponent; then xcodebuild -downloadComponent MetalToolchain; fi
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Meepo.xcodeproj -scheme Meepo -configuration Release -skipPackagePluginValidation \
            -derivedDataPath build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${VERSION:-0.0.0}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          APP=build/Build/Products/Release/Meepo.app
          ditto -c -k --keepParent "$APP" Meepo.zip
          xcrun notarytool submit Meepo.zip --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --wait
          xcrun stapler staple "$APP"
          rm Meepo.zip && ditto -c -k --keepParent "$APP" Meepo.zip
          echo "sha256 for the cask: $(shasum -a 256 Meepo.zip | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Meepo
          path: Meepo.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a suffix (v0.1.0-beta) is a pre-release: the update check ignores it.
        run: |
          PRE=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" Meepo.zip --title "Meepo ${GITHUB_REF_NAME#v}" --generate-notes $PRE
